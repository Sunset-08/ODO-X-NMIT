version: '3.8'
services:
  db:
    image: postgres:14-alpine
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: dayflow
    ports:
      - '5433:5432'
    volumes:
      - dayflow_db_data:/var/lib/postgresql/data

volumes:
  dayflow_db_data:
